# Donyatt Flood Watch Worker.
# Safety: deploys to workers.dev only. Do NOT add `routes`, `route` or custom domains.
name = "donyatt"  # must match the Worker name in the Cloudflare dashboard
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "donyatt-db"
database_id = "d5056217-20ae-42b3-a980-967408c3d457"
migrations_dir = "migrations"

# Used from Stage 2 (cached road status).
[[kv_namespaces]]
binding = "STATUS"
id = "683fae22ded14b73ad42acf6cbfacab1"

# Public values only. Secrets (TURNSTILE_SECRET_KEY, ADMIN_TOKEN) are set as Worker secrets in the dashboard.
[vars]
# Turnstile site key (public). Driver reports stay switched off until this and the secret are both set.
TURNSTILE_SITE_KEY = "0x4AAAAAAFLR2J8xDV4aS2yW"
# Public Telegram alerts channel, linked from the page ("Stay up to date").
TELEGRAM_CHANNEL_URL = "https://t.me/donyattfloodwatch"

# Report photos (Stage 3b). The donyatt-photos bucket was created in the dashboard on 2026-10-01,
# with a lifecycle rule deleting objects after 2 days.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "donyatt-photos"

# Static page (public/index.html). Files are served directly; other paths (/api/status, /health) reach the Worker.
[assets]
directory = "./public"
