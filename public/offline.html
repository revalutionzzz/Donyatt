<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Donyatt Flood Watch</title>
<meta name="theme-color" content="#0a2f47">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a2f47; color: #fff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; padding: 24px 16px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.4rem; margin: 16px 0 8px; }
  p { margin: 8px 0; color: #d6e4ee; }
  strong { color: #fff; }
  button { margin-top: 16px; font: inherit; font-weight: 650; padding: 10px 20px; border-radius: 999px; border: 0; background: #fff; color: #0a2f47; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Donyatt Flood Watch can't show the current A358 status without a connection.</p>
  <p><strong>Never drive into floodwater.</strong> If in doubt, turn around and follow road signs.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
